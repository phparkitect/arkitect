coverage:
  # Round and show coverage as a percentage with two decimals.
  precision: 2
  round: down
  range: "70...100"

  status:
    # Coverage of the whole project. We set a fixed 95% bar with a small
    # tolerance so a single uncovered line in a PR does not turn the build
    # (and main) red.
    project:
      default:
        target: 95%
        # Allow the project coverage to drop by up to 1% before failing.
        threshold: 1%
        # Never fail because the base commit has no coverage report yet.
        if_ci_failed: error

    # Coverage of the lines changed/added by a PR. We don't require 100% of
    # every new line to be covered, otherwise a single untested line fails.
    # No threshold: the 80% target is a hard bar (Codecov defaults threshold
    # to 0%), so the declared bar and the effective one stay the same.
    patch:
      default:
        target: 80%

# Don't post a comment on every PR push; update the existing one instead.
comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
  # Same reason as codecov.notify.after_n_builds below.
  after_n_builds: 2

# Wait for both coverage uploads before computing the status, so the check
# doesn't run against a partial report. The build uploads one report per
# dependency set (see the `flags` below): the code supporting one version of a
# dependency is dead code under the other, so only the merge of the two reports
# describes the coverage of src.
codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true
    after_n_builds: 2

# The flags exist to tell the two uploads apart, not to gate them separately:
# neither dependency set covers src on its own, so a per-flag status would be
# meaningless. Nothing is carried forward from older commits either, both
# reports are uploaded on every build.
flag_management:
  default_rules:
    carryforward: false

ignore:
  - "tests"
  - "examples"
  - "bin"
  - "bin-stub"
