name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: "PHP ${{ matrix.php-versions }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-versions: [ '8.1', '8.2', '8.3', '8.4', '8.5' ]

    steps:
      - uses: actions/checkout@v7

      - name: Install PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          # the PHP that runs the tool; the versions it can analyse are a separate thing
          php-version: ${{ matrix.php-versions }}
          tools: composer:v2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate composer.json
        run: composer validate --no-check-lock

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Coding standards
        run: make lint

      - name: Tests
        run: make test

      # arkitect checking its own architecture: the stage ordering and the
      # hexagon boundaries are rules, so CI is where they hold
      - name: Architecture
        run: make run

  # psalm reads the same source whatever PHP runs it, and psalm.xml fixes the
  # target version, so the matrix would run one analysis five times
  static-analysis:
    name: "Static analysis"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.1'
          tools: composer:v2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # the analysis needs the project's own dependencies: php-parser's types
      # are what the parser internals are checked against
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install psalm
        run: composer install --prefer-dist --no-progress -d tools/psalm

      - name: Psalm
        run: make psalm
